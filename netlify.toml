# Netlify serves this repository as resenha.ink. GitHub Pages keeps serving the same files at its own address.
[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# resenha.ink is the app's sign-in identity, so its metadata names resenha.ink. GitHub Pages keeps serving the
# older metadata at this same path for builds that still sign in as robfromtempo.github.io.
[[redirects]]
  from = "/oauth/client-metadata.json"
  to = "/oauth/client-metadata.resenha-ink.json"
  status = 200
  force = true

[[headers]]
  for = "/oauth/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Content-Type = "application/json"

# Tells Apple devices that resenha.ink review links open in Resenha. Served as JSON, at its exact path, with no redirect.
[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"

# Resenha's server's identity, did:web:resenha.ink. Account servers read it to forward the app's calls to the server.
[[headers]]
  for = "/.well-known/did.json"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"

# Furifont, for Japanese review text. The file name carries its version, so it never changes and can be cached for good.
[[headers]]
  for = "/fonts/FurifontSerifVF-*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

# Comic posters and banners for the catalog, resized by Netlify's image CDN. Only account servers' blob endpoint
# may be fetched, so this isn't a general proxy.
[images]
  remote_images = ["https://[^/]+/xrpc/com\\.atproto\\.sync\\.getBlob\\?.*"]
