# Netlify serves this repository as resenha.ink. GitHub Pages keeps serving the same files at its own address.
[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The repository is the published folder: its source files, tests and package manifests aren't pages. Answered as
# missing, ahead of every other rule.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/src/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

# resenha.ink is the app's sign-in identity, so its metadata names resenha.ink. GitHub Pages keeps serving the
# older metadata at this same path for builds that still sign in as robfromtempo.github.io.
[[redirects]]
  from = "/oauth/client-metadata.json"
  to = "/oauth/client-metadata.resenha-ink.json"
  status = 200
  force = true

[[headers]]
  for = "/oauth/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Content-Type = "application/json"

# The Popfeed migration's writes switch, which the app reads before every book it moves. Never cached, so turning it
# off stops every device within about a minute.
[[headers]]
  for = "/app/migration.json"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "no-store, max-age=0"

# Tells Apple devices that resenha.ink review links open in Resenha. Served as JSON, at its exact path, with no redirect.
[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"

# Resenha's server's identity, did:web:resenha.ink. Account servers read it to forward the app's calls to the server.
[[headers]]
  for = "/.well-known/did.json"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"

# Furifont, for Japanese review text. The file name carries its version, so it never changes and can be cached for good.
[[headers]]
  for = "/fonts/FurifontSerifVF-*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

# Comic posters and banners for the catalog, resized by Netlify's image CDN. Fetched only through resenha.ink's own
# picture door, /img/<did>/<cid>, which checks the account's server and passes pictures alone: never a general proxy.
[images]
  remote_images = ["https://resenha\\.ink/img/.*"]
